<!DOCTYPE html>

    <head>
        <link rel="stylesheet" href="style.css"> 
        <title>Hit That Puck</title>

        <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/ad/35/18/ad351895699d555852d2ac563f6c773c.jpg">
    </head>


    <body>
        <div class = "trackcontainer">

            <div class = "pucktrack">
                <div class =  "hitzone"></div> 
            </div>

             <label class = "pucknote" id = "firstpuck">
                <input type = "checkbox" id="pucknoteclicked" style="opacity:0;">
             </label>

            <label class = "pucknote" id = "secondpuck">
                <input type = "checkbox" id="pucknoteclicked2" style="opacity:0;">
             </label>

            <label class = "pucknote" id = "thirdpuck" >
                <input type = "checkbox" id="pucknoteclicked3" style="opacity:0;">
             </label>

            <div class = "tempgoal">
                <h1>GOAL!</h1>
            </div>
            
            <div class = "goal-display">
                Goals Scored: <span class ="count"></span>
            </div>

        </div>

    </body>
</html>
